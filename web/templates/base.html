<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UFC Analyzer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1><span class="logo-icon">U</span> UFC Analyzer</h1>
            <p>Betting Edge Finder</p>
        </div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
                <span class="nav-icon">&#9678;</span> Dashboard
            </a>
            <a href="{{ url_for('edges_page') }}" class="{% if request.endpoint == 'edges_page' %}active{% endif %}">
                <span class="nav-icon">&#9733;</span> Edge Finder
            </a>
            <a href="{{ url_for('fighters_list') }}" class="{% if request.endpoint in ('fighters_list', 'fighter_detail') %}active{% endif %}">
                <span class="nav-icon">&#9875;</span> Fighters
            </a>
            <a href="{{ url_for('backtest_page') }}" class="{% if request.endpoint == 'backtest_page' %}active{% endif %}">
                <span class="nav-icon">&#9776;</span> Backtest
            </a>
            <div class="nav-divider"></div>
            <a href="https://the-odds-api.com/" target="_blank" rel="noopener">
                <span class="nav-icon">&#8599;</span> Get Odds API Key
            </a>
        </nav>
        <div class="sidebar-footer">
            UFC Betting Analyzer v1.0<br>
            Model: ELO + Logistic Regression
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
